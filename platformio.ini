; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = eldisplay
default_envs = esp32-CYD

[env:esp32-CYD]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.2.0
	arduino-libraries/NTPClient@^3.2.1
	tzapu/WiFiManager
	ESP32Async/AsyncTCP
	esp32async/ESPAsyncWebServer@^3.10.0
	ayushsharma82/ElegantOTA
build_flags =
    -fpermissive
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D DISPLAY_BACKLIGHT_PIN=21
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D TFT_RGB_ORDER=TFT_BGR
    -D SCREEN_INVERTED=1
	; Set to 1 to flip display 180
	; Set to 0 for display in portrait mode (charger port down)
    -D TFT_ROTATION=3

extra_scripts = post:merge_bin.py
board_build.flash_mode = dio

[env:esp32-32E]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
    arduino-libraries/NTPClient@^3.2.1
    tzapu/WiFiManager
    ESP32Async/AsyncTCP
    esp32async/ESPAsyncWebServer@^3.10.0
    ayushsharma82/ElegantOTA
build_flags =
    -fpermissive
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D DISPLAY_BACKLIGHT_PIN=21

    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000

	; Set to 1 to flip display 180
	; Set to 0 for display in landscape mode (charger port down)
    -D TFT_ROTATION=3
